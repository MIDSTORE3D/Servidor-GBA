<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Servidor-GBA · SkyEmu</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#202434;--fg:#f3f4ff;--accent:#9489ed}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--fg);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#canvas{position:fixed;inset:0;display:block;width:100%;height:100%;background:#07080d;touch-action:none}
#toolbar{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;z-index:20;display:flex;gap:6px;pointer-events:none}
#toolbar button{pointer-events:auto;width:38px;height:38px;border:1px solid #b2a9ff47;border-radius:12px;background:#161a2dbe;color:#fff;font-size:19px;cursor:pointer;backdrop-filter:blur(6px)}
#menu{position:fixed;z-index:21;top:56px;right:8px;width:min(330px,calc(100vw - 16px));padding:16px;border-radius:16px;border:1px solid #bbb6f13b;background:#171b2ef2;box-shadow:0 12px 42px #0009}
#menu[hidden],#loading[hidden]{display:none!important}
#menu h2{font-size:15px;margin:0 0 10px}
#menu label{display:block;color:#bec2db;font-size:12px;margin-bottom:6px}
#gameList{width:100%;padding:10px;border-radius:9px;background:#292d43;color:#fff;border:1px solid #5b5c78}
#menu .buttons{display:flex;gap:8px;margin-top:10px}
#menu button,#loading button{padding:10px 12px;border:0;border-radius:9px;background:var(--accent);color:#100e21;font-weight:700;cursor:pointer}
#menu button.secondary{background:#393e59;color:white}
#menu p{margin:12px 0 0;color:#b8bad0;font-size:12px}
#loading{position:fixed;z-index:30;inset:0;display:grid;place-content:center;gap:14px;padding:22px;text-align:center;background:#0e101ae8}
#loading h1{font-size:19px;line-height:1.3;margin:0}
#loading p{max-width:390px;line-height:1.5;color:#c5c4da;margin:0 auto;overflow-wrap:anywhere}
#loading .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#loading button.secondary{background:#353a54;color:#f6f6ff}
#loading progress{width:min(320px,76vw);height:7px;accent-color:#9b8ff7;margin:0 auto}
#loading progress[hidden]{display:none}
#fileInput{display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<canvas id="canvas" tabindex="0" aria-label="Emulador SkyEmu Game Boy Advance" oncontextmenu="event.preventDefault()"></canvas>
<div id="toolbar"><button id="menuButton" type="button" aria-label="Abrir lista de jogos" title="Jogos">☰</button></div>
<section id="menu" hidden aria-label="Jogos">
<h2>Servidor-GBA</h2>
<label for="gameList">Escolher jogo do catálogo</label>
<select id="gameList"><option>Carregando catálogo...</option></select>
<div class="buttons"><button type="button" id="openGame">Abrir jogo</button><button type="button" id="importGame" class="secondary">Abrir arquivo</button></div>
<p>Os botões de toque são os próprios controles móveis do SkyEmu. Os saves dessa versão não são os mesmos do EmulatorJS.</p>
<p>Motor: <a href="https://github.com/skylersaleh/SkyEmu" target="_blank" rel="noopener noreferrer" style="color:#beb7ff">SkyEmu (MIT)</a></p>
</section>
<section id="loading" aria-live="polite">
<h1>Servidor-GBA · SkyEmu</h1>
<p id="loadStatus">Preparando o emulador...</p>
<progress id="progress" hidden></progress>
<div class="actions"><button type="button" id="retry" hidden>Recarregar</button><button type="button" id="manualGame" class="secondary" hidden>Abrir jogo do celular</button></div>
</section>
<input id="fileInput" type="file" accept=".gba,.gb,.gbc,.zip" aria-label="Escolher ROM local">
<script>
'use strict';
const $=s=>document.querySelector(s);
const opts=new URLSearchParams(location.search);
const ENGINE_BASE='https://cdn.jsdelivr.net/gh/skylersaleh/SkyEmu@155cb39a6ec3e32d2fe92b3e2f6c31333b87bd56/';
const gameIDs=/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}(?:\.gba)?$/;
const fileNames=/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}\.gba$/i;
let catalog={}, ready=false, failed=false;
let runtimeResolve;
const engineReady=new Promise(resolve=>runtimeResolve=resolve);
function status(value){if(!failed&&value)$('#loadStatus').textContent=value}
function error(message){failed=true;$('#loadStatus').textContent=message;$('#progress').hidden=true;$('#retry').hidden=false;$('#manualGame').hidden=false;console.error('[Servidor-GBA]',message)}
function showGame(){ready=true;failed=false;$('#loading').hidden=true;$('#menu').hidden=true;document.getElementById('canvas').focus({preventScroll:true})}
function manualFile(){document.getElementById('fileInput').click()}
function sendFile(file){
 if(typeof Module.sokol_drop!=='function')throw Error('O motor de carregamento ainda não está pronto.');
 if(!file||!/\.(gba|gb|gbc|zip)$/i.test(file.name))throw Error('Formato de jogo inválido.');
 // Interface de arrastar/soltar oficialmente usada pelo SkyEmu, sem clicar no canvas.
 Module.sokol_drop({dataTransfer:{files:[file]},clientX:0,clientY:0,stopPropagation(){},preventDefault(){}});
 showGame();
}
async function getCatalog(){
 try{
  const response=await fetch('./jogos/catalogo.json',{cache:'no-store'});
  if(!response.ok)throw Error('Catálogo não encontrado');
  const data=await response.json();
  if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Catálogo inválido');
  catalog=data;
 }catch(e){console.warn('[Servidor-GBA] Catálogo indisponível:',e);catalog={}}
 const list=$('#gameList');list.replaceChildren();
 for(const [id,entry] of Object.entries(catalog)){
  if(!gameIDs.test(id)||!entry||typeof entry.arquivo!=='string'||!fileNames.test(entry.arquivo))continue;
  const option=document.createElement('option');option.value=id;option.textContent=String(entry.nome||id).slice(0,100);list.add(option)
 }
 if(!list.options.length){const opt=document.createElement('option');opt.text='Nenhum jogo no catálogo';opt.value='';list.add(opt)}
 const id=opts.get('jogo')||'001';if([...list.options].some(o=>o.value===id))list.value=id;
}
function gameInfo(){
 const id=opts.get('jogo')||'001';
 if(!gameIDs.test(id))throw Error('Identificador de jogo inválido.');
 const entry=catalog[id];const fallback=id.toLowerCase().endsWith('.gba')?id:id+'.gba';
 const file=(entry&&entry.arquivo)||fallback;
 if(typeof file!=='string'||!fileNames.test(file))throw Error('Nome de jogo inválido.');
 return {file,name:String(entry?.nome||id)};
}
async function waitForDrop(timeoutMs=30000){
 const start=performance.now();await engineReady;
 while(typeof Module.sokol_drop!=='function'){
  if(performance.now()-start>timeoutMs)throw Error('SkyEmu iniciou, mas não disponibilizou o carregador de jogos.');
  await new Promise(r=>setTimeout(r,100));
 }
}
async function bootGame(){
 try{
  await getCatalog();
  const game=gameInfo();
  document.title=game.name+' · Servidor-GBA';
  status('Buscando '+game.name+'...');
  const response=await fetch('./jogos/'+encodeURIComponent(game.file),{cache:'default'});
  if(!response.ok)throw Error('Não encontrei o arquivo jogos/'+game.file+' (HTTP '+response.status+').');
  const blob=await response.blob();
  if(!blob.size)throw Error('O arquivo de jogo está vazio.');
  status('Inicializando SkyEmu...');
  await waitForDrop();
  status('Abrindo '+game.name+'...');
  sendFile(new File([blob],game.file,{type:'application/octet-stream'}));
 }catch(e){error((e&&e.message)||String(e));}
}
// A compilação oficial web do SkyEmu usa este objeto global antes do SkyEmu.js.
var Module={
 canvas:$('#canvas'),
 locateFile(name){return ENGINE_BASE+name},
 print(text){console.log('[SkyEmu]',text)},
 printErr(text){console.error('[SkyEmu]',text)},
 onRuntimeInitialized(){runtimeResolve()},
 setStatus(text){if(text&&text!=='Running...')status(text)},
 monitorRunDependencies(){}
};
$('#menuButton').addEventListener('click',()=>{$('#menu').hidden=!$('#menu').hidden});
$('#openGame').addEventListener('click',()=>{const id=$('#gameList').value;if(!id)return;const url=new URL(location.href);url.searchParams.set('jogo',id);location.assign(url.href)});
$('#importGame').addEventListener('click',manualFile);
$('#manualGame').addEventListener('click',manualFile);
$('#retry').addEventListener('click',()=>location.reload());
$('#fileInput').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{status('Preparando arquivo local...');$('#loading').hidden=false;await waitForDrop();sendFile(file)}catch(err){error(err.message||String(err))}
 e.target.value='';
});
window.addEventListener('error',event=>{if(!ready)error('Falha ao iniciar o SkyEmu: '+(event.message||'erro no navegador'))});
window.addEventListener('unhandledrejection',event=>{if(!ready)error('Falha no SkyEmu: '+String(event.reason?.message||event.reason))});
// O site usa apenas o JS/WASM remoto, sem cache de duas ROMs nem arquivos extras.
const skyScript=document.createElement('script');
skyScript.src=ENGINE_BASE+'SkyEmu.js';
skyScript.async=true;
skyScript.onerror=()=>error('Não foi possível carregar SkyEmu.js. Verifique sua conexão ou o acesso à CDN.');
document.head.appendChild(skyScript);
bootGame();
</script>
</body>
</html>
