<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Servidor-GBA · SkyEmu</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#202434;--fg:#f3f4ff;--accent:#9489ed}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--fg);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#canvas{position:fixed;inset:0;display:block;width:100vw;height:100dvh;background:#07080d;touch-action:none}
/* Bloqueia apenas o botão nativo de escolha de ROMs.
   No modo ?configurar=1, libera o menu interno do SkyEmu para manutenção. */
#menuShield{position:fixed;top:max(2px,env(safe-area-inset-top));left:max(2px,env(safe-area-inset-left));z-index:25;width:56px;height:46px;background:#202020;pointer-events:auto;touch-action:none}
#menuShield[hidden]{display:none!important}
#loading{position:fixed;z-index:30;inset:0;display:grid;place-content:center;gap:14px;padding:22px;text-align:center;background:#0e101ae8}
#loading[hidden]{display:none!important}
#loading h1{font-size:19px;line-height:1.3;margin:0}
#loading p{max-width:390px;line-height:1.5;color:#c5c4da;margin:0 auto;overflow-wrap:anywhere}
#loading button{padding:10px 12px;border:0;border-radius:9px;background:var(--accent);color:#100e21;font-weight:700;cursor:pointer}
#loading .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#loading button.secondary{background:#353a54;color:#f6f6ff}
#loading progress{width:min(320px,76vw);height:7px;accent-color:#9b8ff7;margin:0 auto}
#loading progress[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<canvas id="canvas" tabindex="0" aria-label="Emulador SkyEmu Game Boy Advance" oncontextmenu="event.preventDefault()"></canvas>
<div id="menuShield" aria-hidden="true"></div>
<section id="loading" aria-live="polite">
<h1>Servidor-GBA · SkyEmu</h1>
<p id="loadStatus">Preparando o emulador...</p>
<progress id="progress" hidden></progress>
<div class="actions"><button type="button" id="retry" hidden>Recarregar</button></div>
</section>
<script>
'use strict';
const $=s=>document.querySelector(s);
const opts=new URLSearchParams(location.search);
const modoConfiguracao=opts.get('configurar')==='1';
if(modoConfiguracao)document.querySelector('#menuShield').hidden=true;
// SkyEmu compilado, mantido intacto; menu nativo parcialmente encoberto no modo NFC.
// Os JS/WASM são validados antes de iniciar o motor; ROM é carregada via argv na inicialização.
const SKY_REF='155cb39a6ec3e32d2fe92b3e2f6c31333b87bd56';
const SKY_SOURCES=[
  'https://cdn.jsdelivr.net/gh/skylersaleh/SkyEmu@'+SKY_REF+'/',
  'https://raw.githubusercontent.com/skylersaleh/SkyEmu/'+SKY_REF+'/'
];
let skySource=SKY_SOURCES[0];
const gameIDs=/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}(?:\.gba)?$/;
const fileNames=/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}\.gba$/i;
let catalog={}, ready=false, failed=false;
let runtimeResolve;
let nativeRomResolve;
let nativeRomError=false;
let preloadedRom=null;
const nativeRomStarted=new Promise(resolve=>{nativeRomResolve=resolve});
function reportSkyOutput(value,isError=false){
 const message=String(value||'');
 if(isError)console.error('[SkyEmu]',message);else console.log('[SkyEmu]',message);
 if(/ERROR:\s*failed to load ROM/i.test(message)){
  nativeRomError=true;
  nativeRomResolve();
 }else if(/Loading:\s*\//i.test(message)){
  // O próprio motor informou que leu a ROM no sistema de arquivos em memória.
  // Aguarda a finalização síncrona do carregamento, para detectar erros subsequentes.
  setTimeout(()=>{if(!nativeRomError)nativeRomResolve()},350);
 }
}
const engineReady=new Promise(resolve=>{runtimeResolve=resolve});
// Evita uma promessa sem fim caso a inicialização do WebAssembly falhe sem erro visível.
function deadline(promise, ms, message){
 let timer;
 return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error(message)),ms)})])
   .finally(()=>clearTimeout(timer));
}
async function fetchAsset(url,deadlineMs){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),deadlineMs);
 try{
  const res=await fetch(url,{signal:controller.signal,cache:'force-cache',mode:'cors'});
  if(!res.ok)throw Error('HTTP '+res.status);
  return await res.arrayBuffer();
 }finally{clearTimeout(timer)}
}
async function loadSkyEngine(){
 let diagnostics=[];
 for(let idx=0;idx<SKY_SOURCES.length;idx++){
  const base=SKY_SOURCES[idx];
  status(idx?'Tentando fonte alternativa do SkyEmu...':'Baixando motor SkyEmu...');
  try{
   // Não executa JavaScript remoto enquanto não tivermos o WebAssembly correspondente.
   const [jsData,wasmData]=await Promise.all([
    fetchAsset(base+'SkyEmu.js',30000),fetchAsset(base+'SkyEmu.wasm',45000)
   ]);
   const magic=new Uint8Array(wasmData,0,Math.min(4,wasmData.byteLength));
   if(magic.length!==4||magic[0]!==0||magic[1]!==97||magic[2]!==115||magic[3]!==109)
    throw Error('O arquivo WASM recebido não é válido.');
   const code=new TextDecoder().decode(jsData);
   if(!code.includes('sapp_js_add_dragndrop_listeners'))throw Error('A versão JavaScript recebida não corresponde ao motor esperado.');
   skySource=base;
   Module.wasmBinary=new Uint8Array(wasmData); // elimina a segunda busca de WASM
   status('Inicializando SkyEmu...');
   await new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    const script=document.createElement('script');
    script.src=url;script.async=true;
    script.onload=()=>{URL.revokeObjectURL(url);resolve()};
    script.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Falha ao executar o JavaScript do motor.'))};
    document.head.appendChild(script);
   });
   return;
  }catch(e){
   diagnostics.push('Fonte '+(idx+1)+': '+(e.name==='AbortError'?'tempo esgotado':e.message));
   console.warn('[Servidor-GBA] Motor indisponível:',base,e);
  }
 }
 throw Error('Não foi possível baixar o SkyEmu. '+diagnostics.join(' | ')+' Verifique a conexão ou o bloqueio das fontes externas.');
}
function status(value){if(!failed&&value)$('#loadStatus').textContent=value}
function error(message){if(failed)return;failed=true;$('#loadStatus').textContent=message;$('#progress').hidden=true;$('#retry').hidden=false;console.error('[Servidor-GBA]',message)}
function showGame(){ready=true;failed=false;$('#loading').hidden=true;document.getElementById('canvas').focus({preventScroll:true})}
async function getCatalog(){
 const response=await fetch('./jogos/catalogo.json',{cache:'no-store'});
 if(!response.ok)throw Error('Catálogo de jogos indisponível (HTTP '+response.status+').');
 const data=await response.json();
 if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Catálogo inválido.');
 catalog=data;
}
function gameInfo(){
 const id=opts.get('jogo')||'001';
 if(!gameIDs.test(id))throw Error('Identificador do cartucho NFC inválido.');
 const entry=catalog[id];
 if(!entry||typeof entry.arquivo!=='string')throw Error('Cartucho não cadastrado: '+id+'. Confira jogos/catalogo.json.');
 if(!fileNames.test(entry.arquivo))throw Error('Arquivo inválido no catálogo: '+id+'.');
 return {file:entry.arquivo,name:String(entry.nome||id).slice(0,120)};
}
async function bootGame(){
 try{
  await getCatalog();
  const game=gameInfo();
  document.title=game.name+' · Servidor-GBA';
  status('Buscando '+game.name+'...');
  const response=await fetch('./jogos/'+encodeURIComponent(game.file),{cache:'default'});
  if(!response.ok)throw Error('Não encontrei jogos/'+game.file+' (HTTP '+response.status+').');
  const bytes=new Uint8Array(await response.arrayBuffer());
  if(!bytes.length)throw Error('O arquivo de jogo está vazio.');
  // Ao contrário do método anterior, não simula um arrastar-e-soltar após iniciar.
  // O SkyEmu suporta inicialização com caminho de ROM em argv[1].
  // Stage via Emscripten preRun antes de o main() do motor iniciar: funciona sem
  // depender dos eventos de drag/drop, que não são uniformes no Android.
  preloadedRom={file:game.file,bytes};
  Module.arguments=['/'+game.file];
  Module.preRun=[function(){
   if(!preloadedRom)throw Error('ROM não preparada.');
   FS.writeFile('/'+preloadedRom.file,preloadedRom.bytes);
   // Libera a referência JS; o emulador mantém os dados na memória virtual até o carregamento.
   preloadedRom=null;
  }];
  status('Iniciando SkyEmu com '+game.name+'...');
  await loadSkyEngine();
  await deadline(engineReady,60000,'O SkyEmu não concluiu a inicialização.');
  status('Abrindo '+game.name+' no SkyEmu...');
  await deadline(nativeRomStarted,20000,'O SkyEmu abriu, mas não confirmou o carregamento do jogo. Tente recarregar ou abrir o arquivo pelo menu.');
  if(nativeRomError)throw Error('SkyEmu recebeu o jogo, mas não conseguiu abrir a ROM.');
  showGame();
 }catch(e){error((e&&e.message)||String(e))}
}
// A compilação oficial web do SkyEmu usa este objeto global antes do SkyEmu.js.
var Module={
 canvas:$('#canvas'),
 locateFile(name){return skySource+name},
 print(text){reportSkyOutput(text)},
 printErr(text){reportSkyOutput(text,true)},
 onRuntimeInitialized(){runtimeResolve()},
 setStatus(text){if(text&&text!=='Running...')status(text)},
 monitorRunDependencies(){}
};
// O jogador não escolhe ROMs: a tag NFC define ?jogo=ID. Sem menu de seleção no HTML.
// Tela cheia e orientação horizontal são solicitadas apenas pelo manifesto
// quando o navegador iniciar o site como PWA instalado.
// Na abertura normal por NFC não solicitamos fullscreen nem rotação.
$('#retry').addEventListener('click',()=>location.reload());
window.addEventListener('error',event=>{if(!ready)error('Falha ao iniciar o SkyEmu: '+(event.message||'erro no navegador'))});
window.addEventListener('unhandledrejection',event=>{if(!ready)error('Falha no SkyEmu: '+String(event.reason?.message||event.reason))});
// Os arquivos ficam apenas no cache do navegador, sem acréscimos ao repositório.
// Se a CDN falhar, tenta o conteúdo bruto da mesma revisão do GitHub.
bootGame();
</script>
</body>
</html>
