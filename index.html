<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Game Boy Advance</title>
<style>
:root{--size:clamp(36px,9.6vw,64px);--control-opacity:.26;--pad-height:clamp(185px,30dvh,260px)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#08090f}
body{font-family:Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible{outline:2px solid #f8ef91;outline-offset:2px}
/* Estrutura: a tela e os controles NÃO compartilham pixels ou camadas. */
.console{width:100%;height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--pad-height);overflow:hidden;background:#08090f}
.display{position:relative;grid-row:1;grid-column:1;min-height:0;min-width:0;overflow:hidden;display:grid;place-items:center;contain:layout paint}
.bezel,.screen,.game{position:relative;width:100%;height:100%;min-width:0;min-height:0;background:#000}
.game.ejs_parent{height:100%!important;width:100%!important;min-height:0!important}
.game .ejs_canvas_parent,.game .ejs_canvas{height:100%!important;width:100%!important}
.game .ejs_canvas{object-fit:contain!important;image-rendering:pixelated}
.game .ejs_virtualGamepad_parent,.game .ejs_menu_bar,.game .ejs_settings_parent,.game .ejs_popup_container,.game .ejs_context_menu{display:none!important}
.overlay{position:absolute;inset:0;z-index:5;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:16px;color:#fff;background:#08090f;font-size:14px}
.overlay[hidden]{display:none!important}
.overlay button{border:0;border-radius:10px;background:#655d91;color:#fff;padding:10px 14px}
.spinner{width:26px;height:26px;border:3px solid #42424f;border-top-color:#e4e1ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* A área dos controles não é uma película por cima do canvas. */
.controls{grid-row:2;grid-column:1;position:relative;z-index:1;min-height:0;min-width:0;padding:8px 12px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;gap:4px;background:#08090f;touch-action:none;contain:layout paint}
.shoulders{display:flex;justify-content:space-between;max-width:840px;width:100%;margin:0 auto;pointer-events:none}
.shoulder{height:31px;width:clamp(86px,19vw,155px);font-size:12px;font-weight:800;color:#fff;border:1px solid #c0b8ff36;border-radius:12px;background:rgba(100,90,160,var(--control-opacity));pointer-events:auto}
.control-row{width:min(100%,840px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:5px;pointer-events:none}
.dpad{position:relative;width:calc(var(--size)*3);height:calc(var(--size)*3);justify-self:start;touch-action:none;pointer-events:auto}
.dpad::before,.dpad::after{content:"";position:absolute;border-radius:7px;background:rgba(124,119,182,var(--control-opacity));border:1px solid #cac4fb2c;pointer-events:none}
.dpad::before{left:0;top:33.333%;width:100%;height:33.333%}.dpad::after{top:0;left:33.333%;width:33.333%;height:100%}
.dir{position:absolute;z-index:1;width:var(--size);height:var(--size);background:transparent;border:0;color:#c9c7e7;font-size:19px;font-weight:bold;pointer-events:none}
.up{top:0;left:33.333%}.down{bottom:0;left:33.333%}.left{top:33.333%;left:0}.right{top:33.333%;right:0}
.system{display:flex;gap:6px;align-self:end;padding-bottom:8px;pointer-events:none}
.system button{border-radius:15px;background:rgba(109,107,133,var(--control-opacity));color:#fff;border:1px solid #c0b8ff30;padding:8px 6px;font-size:9px;font-weight:bold;min-width:46px;pointer-events:auto}
.actions{justify-self:end;display:flex;gap:clamp(5px,1.8vw,18px);align-items:center;transform:rotate(-15deg);padding:3px;pointer-events:none}
.ab{width:clamp(48px,12vw,75px);height:clamp(48px,12vw,75px);border:2px solid #b6aaff77;border-radius:50%;background:rgba(107,88,185,var(--control-opacity));color:#fff;font-size:25px;font-weight:900;pointer-events:auto}
.ab:first-child{transform:translateY(10px)}.ab:last-child{transform:translateY(-10px)}
.controls button:active,.dpad:active{filter:brightness(1.1)}
/* Paisagem: tela à esquerda; controles à direita, sem sobreposição. */
@media (orientation:landscape) and (max-height:620px){
 :root{--size:clamp(26px,12.5vh,52px)}
 .console{grid-template-columns:minmax(0,1fr) clamp(250px,40vw,435px);grid-template-rows:minmax(0,1fr)}
 .display{grid-column:1;grid-row:1}
 .controls{grid-column:2;grid-row:1;padding:8px max(8px,env(safe-area-inset-right)) 8px 8px;align-content:center}
 .shoulders{margin:0}.shoulder{height:27px}
 .system{flex-direction:column;gap:4px;padding-bottom:0}.system button{padding:6px 4px}
 .ab{width:clamp(43px,12vh,62px);height:clamp(43px,12vh,62px)}
}
@media(max-width:370px){:root{--size:36px}.controls{padding-left:5px;padding-right:5px}.system{gap:3px}.system button{min-width:40px;padding:8px 3px;font-size:8px}.ab{width:47px;height:47px}.actions{gap:3px}}
.perf{position:absolute;top:8px;left:8px;z-index:7;pointer-events:none;padding:6px 9px;border-radius:8px;background:#060915dc;color:#baf5d1;font:11px/1.45 monospace;white-space:pre-line;max-width:90%}
</style>
</head>
<body>
<main class="console">
 <section class="display" id="display"><div class="bezel"><div class="screen"><div id="game" class="game"></div></div></div>
  <div id="loading" class="overlay"><div class="spinner"></div><span id="loadStatus">Preparando Game Boy Advance...</span></div>
  <div id="error" class="overlay" hidden><span id="errorText"></span><button type="button" onclick="location.reload()">Tentar novamente</button></div>
 </section>
 <section class="controls" aria-label="Controles GBA">
  <div class="shoulders"><button class="shoulder" type="button" data-key="L">L</button><button class="shoulder" type="button" data-key="R">R</button></div>
  <div class="control-row"><div class="dpad" id="dpad" role="group" aria-label="Direcional"><button class="dir up" type="button" data-dir="UP" tabindex="-1">▲</button><button class="dir down" type="button" data-dir="DOWN" tabindex="-1">▼</button><button class="dir left" type="button" data-dir="LEFT" tabindex="-1">◀</button><button class="dir right" type="button" data-dir="RIGHT" tabindex="-1">▶</button></div><div class="system"><button type="button" data-key="SELECT">SELECT</button><button type="button" data-key="START">START</button></div><div class="actions"><button class="ab" type="button" data-key="B">B</button><button class="ab" type="button" data-key="A">A</button></div></div>
 </section>
</main>
<script>
'use strict';
const params=new URLSearchParams(location.search);
// Preserva a otimização de transparência WebGL da versão anterior,
// sem limitar o renderizador a um modelo específico de celular.
if(params.get('gpu')!=='normal'){
 const get=HTMLCanvasElement.prototype.getContext;
 HTMLCanvasElement.prototype.getContext=function(type,options){
  if(type==='webgl'||type==='webgl2'||type==='experimental-webgl')options={...(options||{}),alpha:false,premultipliedAlpha:false};
  return get.call(this,type,options);
 };
}
const $=q=>document.querySelector(q);
const ids={B:0,SELECT:2,START:3,UP:4,DOWN:5,LEFT:6,RIGHT:7,A:8,L:10,R:11};
const keys=Object.keys(ids),sources=new Map(keys.map(k=>[k,new Set()]));
let ready=false;
function status(t){$('#loadStatus').textContent=t}
function fail(t){$('#loading').hidden=true;$('#error').hidden=false;$('#errorText').textContent=t;console.error('[GBA]',t)}
const noCommand=params.get('entrada')==='semcomando';
const queue=[];let scheduled=false;
function emit(key,pressed){if(!ready||noCommand)return;try{window.EJS_emulator?.gameManager?.simulateInput(0,ids[key],pressed?1:0)}catch(e){console.warn('Falha ao enviar comando',e)}}
function flush(){scheduled=false;if(!ready){queue.length=0;return}const used=new Set();for(let i=0;i<queue.length;){const [key,down]=queue[i];if(used.has(key)){i++;continue}used.add(key);queue.splice(i,1);emit(key,down)}if(queue.length){scheduled=true;requestAnimationFrame(flush)}}
function input(key,source,down){const set=sources.get(key);if(!set)return;const was=set.size>0;if(down)set.add(source);else set.delete(source);const now=set.size>0;if(was===now||!ready)return;queue.push([key,now]);if(!scheduled){scheduled=true;requestAnimationFrame(flush)}}
function release(source){for(const key of keys)input(key,source,false)}
for(const button of document.querySelectorAll('[data-key]')){
 const key=button.dataset.key;
 button.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();try{button.setPointerCapture(e.pointerId)}catch(_){}input(key,'p'+e.pointerId,true)});
 for(const name of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(name,e=>input(key,'p'+e.pointerId,false));
 button.addEventListener('contextmenu',e=>e.preventDefault());
}
const pad=$('#dpad'),activePad=new Set(),dirs=['UP','DOWN','LEFT','RIGHT'];let padBox=null;
function dpadMove(e){const r=padBox||pad.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;const s='d'+e.pointerId;let next={UP:y<-.18,DOWN:y>.18,LEFT:x<-.18,RIGHT:x>.18};if(Math.abs(x)<.13&&Math.abs(y)<.13)dirs.forEach(k=>next[k]=false);dirs.forEach(k=>input(k,s,next[k]))}
pad.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();activePad.add(e.pointerId);padBox=pad.getBoundingClientRect();try{pad.setPointerCapture(e.pointerId)}catch(_){}dpadMove(e)});
pad.addEventListener('pointermove',e=>{if(activePad.has(e.pointerId)){e.preventDefault();dpadMove(e)}});
for(const name of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(name,e=>{if(!activePad.delete(e.pointerId))return;release('d'+e.pointerId);if(!activePad.size)padBox=null});
pad.addEventListener('contextmenu',e=>e.preventDefault());
const keyboard={ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',KeyZ:'B',KeyX:'A',KeyA:'L',KeyS:'R',Enter:'START',ShiftLeft:'SELECT',ShiftRight:'SELECT'};
for(const [eventName,isDown] of [['keydown',true],['keyup',false]])document.addEventListener(eventName,e=>{const k=keyboard[e.code];if(!k)return;e.preventDefault();e.stopImmediatePropagation();input(k,'kb'+e.code,isDown)},true);
function releaseAll(){for(const [key,set] of sources)for(const source of [...set])input(key,source,false)}
window.addEventListener('blur',releaseAll);window.addEventListener('pagehide',releaseAll);
// Use o mesmo identificador de jogo para preservar o vínculo com os saves existentes.
async function gameSelection(){const id=params.get('jogo')||'001';if(!/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}(?:\.gba)?$/.test(id))throw Error('Identificador do jogo inválido');const r=await fetch('./jogos/catalogo.json',{cache:'no-store'});const catalog=r.ok?await r.json():{};const item=catalog[id];const filename=item?.arquivo||(id.toLowerCase().endsWith('.gba')?id:id+'.gba');if(typeof filename!=='string'||!/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,79}\.gba$/i.test(filename))throw Error('Arquivo inválido no catálogo');return {filename,title:item?.nome||id}}
async function recoverOldWorker(){if(!('serviceWorker' in navigator))return;try{const registrations=await navigator.serviceWorker.getRegistrations();for(const r of registrations){if(r.scope.startsWith(new URL('./',location.href).href))await r.unregister()}if(navigator.serviceWorker.controller&&sessionStorage.getItem('gba-recover-reloaded')!=='1'){sessionStorage.setItem('gba-recover-reloaded','1');location.replace(location.pathname+location.search+(location.search?'&':'?')+'recuperado=1');return new Promise(()=>{})}}catch(e){console.warn('Recuperação do Service Worker',e)}}
// Ferramenta de diagnóstico SEM EmulatorJS: mede se a animação do próprio navegador
// perde quadros quando alguém toca na área dos controles.
function diagnostic(){document.title='Teste de toque · GBA';$('#loading').hidden=true;const game=$('#game');const canvas=document.createElement('canvas');canvas.width=320;canvas.height=200;canvas.style.cssText='width:100%;height:100%;object-fit:contain;image-rendering:pixelated';game.appendChild(canvas);const ctx=canvas.getContext('2d',{alpha:false});const perf=document.createElement('output');perf.className='perf';$('#display').appendChild(perf);let prev=0,frames=0,late=0,start=0;function frame(t){if(prev){frames++;if(t-prev>33.3)late++}prev=t;if(!start)start=t;ctx.fillStyle='#101726';ctx.fillRect(0,0,320,200);ctx.fillStyle='#73d6e8';ctx.fillRect((t*.12)%360-20,85,35,35);ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.fillText('Teste sem emulador',15,20);if(t-start>=1000){const sec=(t-start)/1000;perf.textContent='Sem EmulatorJS\nFPS navegador: '+Math.round(frames/sec)+'\nQuadros lentos: '+late+'/s';start=t;frames=0;late=0}requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function startPerf(){if(params.get('medir')!=='1')return;const perf=document.createElement('output');perf.className='perf';$('#display').appendChild(perf);let prev=0,start=0,frames=0,late=0,previousEmu=null;function sample(t){if(prev){frames++;if(t-prev>33.3)late++}prev=t;if(!start)start=t;if(t-start>=1000){const sec=(t-start)/1000;const gm=window.EJS_emulator?.gameManager;const emu=typeof gm?.getFrameNum==='function'?gm.getFrameNum():null;const emuFPS=emu!==null&&previousEmu!==null?Math.round((emu-previousEmu)/sec):'—';perf.textContent='FPS emulador: '+emuFPS+'\nFPS navegador: '+Math.round(frames/sec)+'\nQuadros lentos: '+late+'/s';previousEmu=emu;frames=0;late=0;start=t}requestAnimationFrame(sample)}requestAnimationFrame(sample)}
async function boot(){try{status('Verificando versão local...');await recoverOldWorker();status('Selecionando jogo...');const game=await gameSelection();document.title=game.title+' · GBA';const rom=new URL('./jogos/'+game.filename,location.href);window.EJS_player='#game';window.EJS_core='gba';window.EJS_gameUrl=rom.href;window.EJS_gameName=game.title;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);window.EJS_startOnLoaded=!isMobile;window.EJS_forceLegacyCores=params.get('render')==='webgl1';window.EJS_color='#594e9a';window.EJS_volume=.85;window.EJS_controlScheme='gba';window.EJS_defaultOptions={shader:'disabled',rewindEnabled:'disabled',fps:'hide',vsync:'disabled'};window.EJS_onGameStart=()=>{ready=true;$('#loading').hidden=true;for(const k of keys)if(sources.get(k).size)emit(k,true)};startPerf();const script=document.createElement('script');if(isMobile){const observer=new MutationObserver(()=>{if($('#game .ejs_start_button')){observer.disconnect();if(!ready)$('#loading').hidden=true}});observer.observe($('#game'),{childList:true,subtree:true});setTimeout(()=>{observer.disconnect();if(!ready&&$('#error').hidden)$('#loading').hidden=true},8000)}script.onload=()=>status('Toque em Jogar para iniciar');script.onerror=()=>fail('Não foi possível carregar o EmulatorJS. Verifique a conexão.');script.src='https://cdn.emulatorjs.org/stable/data/loader.js';document.head.appendChild(script);setTimeout(()=>{if(!ready&&$('#error').hidden)fail('O jogo demorou para iniciar. Tente recarregar.')},60000)}catch(e){fail(e.message||String(e))}}
window.addEventListener('error',e=>{if(!ready&&params.get('teste')!=='toque')fail('Erro de inicialização: '+(e.message||'JavaScript'))});window.addEventListener('unhandledrejection',e=>{if(!ready&&params.get('teste')!=='toque')fail('Erro de inicialização: '+String(e.reason?.message||e.reason))});
if(params.get('teste')==='toque')diagnostic();else boot();
</script>
</body>
</html>
